name: Build onnxruntime FreeBSD Wheel

on:
  workflow_dispatch:
    inputs:
      onnxruntime_version:
        description: 'onnxruntime version to build'
        required: true
        default: '1.27.0'
      python_version:
        description: 'Python version'
        required: true
        default: '3.12'
        type: choice
        options:
          - '3.12'
          - '3.13'
          - '3.14'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, no-avx]
    steps:
      - uses: actions/checkout@v4

      - name: Build onnxruntime wheel on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          vnc_password: ${{ secrets.VNC_PASSWORD }}
          usesh: true
          copyback: true
          prepare: |
            PYVER=$(echo "${{ inputs.python_version }}" | tr -d '.')
            pkg install -y cmake ninja gmake git patch \
              python${PYVER} \
              py${PYVER}-pip \
              py${PYVER}-setuptools \
              py${PYVER}-wheel \
              py${PYVER}-numpy \
              py${PYVER}-pybind11
            # Override BSD patch with GNU patch (onnxruntime uses --binary flag)
            mv /usr/bin/patch /usr/bin/patch.bsd
            ln -sf /usr/local/bin/gpatch /usr/bin/patch
            which patch && patch --version | head -1
          run: |
            set -ex
            PYVER=$(echo "${{ inputs.python_version }}" | tr -d '.')
            PYTHON=python${PYVER%??}.${PYVER#?}
            VERSION=${{ inputs.onnxruntime_version }}
            VARIANT="${{ matrix.variant }}"

            # Clone onnxruntime
            git clone --depth 1 --branch v${VERSION} --recursive \
              https://github.com/microsoft/onnxruntime.git
            cd onnxruntime

            # Apply FreeBSD patch (from checked-out repo)
            patch -p1 < ../patches/onnxruntime-freebsd.patch

            # Build with wheel generation
            if [ "$VARIANT" = "no-avx" ]; then
              NO_AVX_FLAGS="-march=x86-64 -mno-avx -mno-avx2 -mno-sse4.1 -mno-sse4.2 -mno-ssse3 -mno-fma"
              export CFLAGS="${NO_AVX_FLAGS}"
              export CXXFLAGS="-I$(pwd)/include/onnxruntime/core/common/logging ${NO_AVX_FLAGS}"
              BUILD_FLAGS="--cmake_extra_defines onnxruntime_USE_AVX=OFF onnxruntime_USE_AVX2=OFF onnxruntime_USE_AVX512=OFF CMAKE_C_FLAGS=\"${NO_AVX_FLAGS}\" CMAKE_CXX_FLAGS=\"${NO_AVX_FLAGS}\""
            else
              export CXXFLAGS="-I$(pwd)/include/onnxruntime/core/common/logging"
              BUILD_FLAGS=""
            fi

            CC=clang CXX=clang++ ${PYTHON} ./tools/ci_build/build.py \
              --build_dir ./build/FreeBSD \
              --config Release \
              --enable_pybind \
              --build_wheel \
              --skip_tests \
              --parallel \
              --compile_no_warning_as_error \
              --allow_running_as_root \
              ${BUILD_FLAGS}

            # Copy wheel to workspace for upload
            mkdir -p ../dist
            if [ "$VARIANT" = "no-avx" ]; then
              for w in build/FreeBSD/Release/dist/onnxruntime-*.whl; do
                new_w=$(echo "$w" | sed 's/\.whl$/_no_avx.whl/')
                cp "$w" "../dist/$(basename "$new_w")"
              done
            else
              cp build/FreeBSD/Release/dist/onnxruntime-*.whl ../dist/
            fi

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-freebsd-py${{ inputs.python_version }}-${{ matrix.variant }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: onnxruntime-freebsd-py${{ inputs.python_version }}-*
          path: dist
          merge-multiple: true

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONNX_VERSION: ${{ inputs.onnxruntime_version }}
          PY_VERSION: ${{ inputs.python_version }}
        run: |
          TAG="onnxruntime-${ONNX_VERSION}"

          # Create release if it doesn't exist, otherwise upload all wheels to existing release
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.whl --clobber
          else
            gh release create "${TAG}" \
              dist/*.whl \
              --title "onnxruntime ${ONNX_VERSION} FreeBSD wheels" \
              --notes "Pre-built onnxruntime ${ONNX_VERSION} wheels for FreeBSD 15 / Python ${PY_VERSION} (amd64, standard and no-avx)"
          fi
