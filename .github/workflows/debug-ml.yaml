# TEMPORARY -- delete once the CIT crash is understood.
# Runs the gunicorn worker's import path in the foreground on a GHA FreeBSD VM,
# so the traceback lands in the log instead of being buried by s6 restarts.
name: debug-ml

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and import immich_ml in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1.5.2
        with:
          release: "15.1"
          usesh: true
          prepare: |
            pkg install -y podman ocijail catatonit buildah skopeo jq python3 devel/py-pyyaml
            kldload pf || true
            sysctl net.inet.ip.forwarding=1 || true
          run: |
            echo "=== host ==="
            sysctl -n hw.model hw.ncpu
            grep -o 'AVX[0-9A-Z]*' /var/run/dmesg.boot 2>/dev/null | sort -u | tr '\n' ' '; echo
            podman --version

            # Build here, the way CI does, and test THAT image -- the pulled
            # :debug image (built on saturn) already passes every check below.
            fetch -qo /tmp/dbuild.tar.gz \
              "https://github.com/daemonless/dbuild/archive/v1.9.16.tar.gz"
            mkdir -p /tmp/dbuild && tar -xzf /tmp/dbuild.tar.gz -C /tmp/dbuild --strip-components=1
            export PYTHONPATH=/tmp/dbuild
            python3 -m dbuild -v build --variant latest --arch amd64 || echo "BUILD FAILED rc=$?"

            IMG=ghcr.io/daemonless/immich-ml:build-latest
            echo "=== image under test: $IMG ==="
            podman images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep immich-ml
            echo "=== start it exactly as CIT does ==="
            podman volume create cit-debug-config >/dev/null 2>&1 || true
            podman run -d --name cit-debug --network=podman \
              -e PUID=1000 -e PGID=1000 -v cit-debug-config:/config "$IMG"

            # Let it crash-loop a few times, then take the WHOLE log.
            sleep 45
            echo "=== podman logs cit-debug (full, untruncated) ==="
            podman logs cit-debug 2>&1

            echo "=== inspect ==="
            podman ps -a --format '{{.Names}} {{.Status}}'
            podman inspect cit-debug --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}} err={{.State.Error}}' 2>&1

            echo "=== same image, s6 bypassed (known-good control) ==="
            podman run --rm --entrypoint "" "$IMG" sh -c '
              export HOME=/config MPLCONFIGDIR=/tmp HF_HOME=/cache/huggingface
              cd /opt/venv && timeout 30 ./bin/python -m gunicorn immich_ml.main:app \
                -k uvicorn.workers.UvicornWorker -b 0.0.0.0:3003 -w 1 --timeout 300' 2>&1 | tail -8
            echo "(rc=124 above means it stayed up for the full 30s)"
