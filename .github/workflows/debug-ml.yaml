# TEMPORARY -- A/B the two prepare environments in one VM.
# The real build workflow fails CIT; this debug workflow passes it. Same VM
# type, same image, same dbuild. This runs CIT twice in one VM: once with the
# stock setup (known good), then after installing the real workflow's
# build-tools package set (suspected bad).
name: debug-ml

on:
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare VM data directory
        run: sudo mkdir -p /mnt/freebsd-vm && sudo chmod 777 /mnt/freebsd-vm

      - name: A/B the prepare environment
        uses: vmactions/freebsd-vm@v1.5.2
        with:
          release: "15.1"
          usesh: true
          data-dir: /mnt/freebsd-vm
          prepare: |
            pkg install -y podman ocijail catatonit buildah skopeo jq python3 devel/py-pyyaml
            kldload pf || true
            sysctl net.inet.ip.forwarding=1 || true
          run: |
            set -x
            fetch -qo /tmp/dbuild.tar.gz \
              "https://github.com/daemonless/dbuild/archive/v1.9.16.tar.gz"
            mkdir -p /tmp/dbuild && tar -xzf /tmp/dbuild.tar.gz -C /tmp/dbuild --strip-components=1
            export PYTHONPATH=/tmp/dbuild

            # Use the prebuilt image so each test is ~2 min, not 15.
            podman pull ghcr.io/daemonless/immich-ml:debug
            podman tag ghcr.io/daemonless/immich-ml:debug \
                       ghcr.io/daemonless/immich-ml:build-latest

            echo "##### A: stock environment (expect PASS) #####"
            podman --version; ocijail --version 2>&1 | head -1
            python3 -m dbuild -v test --variant latest; echo "A result: rc=$?"

            echo "##### switching to the real workflow's build-tools set #####"
            BT=$(fetch -qo - https://api.github.com/repos/daemonless/build-tools/releases/latest | jq -r .tag_name)
            echo "build-tools ref: $BT"
            fetch -qo /tmp/bt.tar.gz \
              "https://github.com/daemonless/build-tools/releases/download/${BT}/${BT}.tar.gz"
            mkdir -p /tmp/bt && tar -xzf /tmp/bt.tar.gz -C /tmp/bt
            mkdir -p /etc/pkg
            printf 'local: { url: "file:///tmp/bt", enabled: yes }\nFreeBSD: { enabled: no }\n' > /etc/pkg/FreeBSD.conf
            pkg repo /tmp/bt
            pkg install -fy podman sysutils/podman-compose jq skopeo buildah trivy python3 devel/py-pyyaml appjail ocijail
            mkdir -p /var/log/appjail/jails /usr/local/appjail/jails
            rm -rf /var/db/containers /var/lib/containers 2>/dev/null || true
            kldload pf || true
            sysctl net.inet.ip.forwarding=1 || true
            sysctl kern.ipc.shm_allow_removed=1 || true

            echo "##### B: real-workflow environment (expect FAIL) #####"
            podman --version; ocijail --version 2>&1 | head -1
            python3 -m dbuild -v test --variant latest; echo "B result: rc=$?"

            echo "##### if B failed, the container's full log #####"
            podman run -d --name pm -e PUID=1000 -e PGID=1000 \
              ghcr.io/daemonless/immich-ml:build-latest || true
            sleep 40
            podman logs pm 2>&1 | head -60
