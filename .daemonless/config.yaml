icon: ':material-brain:'
cit:
  port: 3003
  health: /ping

build:
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
    - tag: beta
      containerfile: Containerfile
      tag_desc: Beta release built from upstream v3.2.0-rc.1.
      args:
        UPSTREAM_URL: "https://api.github.com/repos/immich-app/immich/releases/tags/v3.2.0-rc.1"

